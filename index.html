<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Late Night</title>
  <meta name="description" content="A tiny digital room for quiet evenings." />
  <meta name="theme-color" content="#05060b" />
  <link rel="icon" href="moon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="aurora" aria-hidden="true"></div>
  <div class="city" aria-hidden="true"></div>
  <div class="breath" aria-hidden="true"></div>
  <canvas class="stars-layer" id="stars" aria-hidden="true"></canvas>
  <canvas class="rain-layer" id="rain" aria-hidden="true"></canvas>
  <div class="grain" aria-hidden="true"></div>

  <main class="room">
    <header class="intro">
      <p class="clock" id="clock">--:--</p>
      <h1 class="title">LATE&nbsp;NIGHT</h1>
      <p class="tagline">a tiny room for quiet evenings</p>
    </header>

    <section class="moods" aria-label="Choose a mood">
      <button class="mood" data-mood="calm" type="button"><span class="mood-icon">&#127769;</span><span class="mood-name">Calm</span></button>
      <button class="mood" data-mood="music" type="button"><span class="mood-icon">&#127911;</span><span class="mood-name">Music</span></button>
      <button class="mood" data-mood="focus" type="button"><span class="mood-icon">&#128293;</span><span class="mood-name">Focus</span></button>
      <button class="mood" data-mood="rain" type="button"><span class="mood-icon">&#127783;</span><span class="mood-name">Rain</span></button>
      <button class="mood" data-mood="space" type="button"><span class="mood-icon">&#127756;</span><span class="mood-name">Space</span></button>
      <button class="mood" data-mood="sleep" type="button"><span class="mood-icon">&#128164;</span><span class="mood-name">Sleep</span></button>
    </section>

    <p class="mood-line" id="mood-line"></p>

    <section class="focus" id="focus" aria-label="Focus timer">
      <div class="focus-presets" id="focus-presets" aria-label="Session length">
        <button class="focus-preset" data-minutes="15" type="button">15</button>
        <button class="focus-preset" data-minutes="25" type="button">25</button>
        <button class="focus-preset" data-minutes="45" type="button">45</button>
        <button class="focus-preset" data-minutes="60" type="button">60</button>
      </div>

      <p class="focus-time" id="focus-time">25:00</p>
      <div class="focus-controls">
        <button class="focus-btn" id="focus-toggle" type="button">start</button>
        <button class="focus-btn" id="focus-reset" type="button">reset</button>
      </div>

      <p class="focus-note" id="focus-note"></p>
    </section>

    <div class="player" id="player" aria-label="Lo-fi player">
      <button class="player-play" id="player-play" type="button">play</button>
      <button class="player-next" id="player-next" type="button">next</button>

      <label class="player-volume">
        <span class="visually-hidden">Tape volume</span>
        <input type="range" id="player-volume" min="0" max="100" step="1" value="55" />
      </label>

      <div class="stations" id="stations">
        <button class="station" data-station="tape" type="button">tape</button>
        <button class="station" data-station="radio" type="button">radio</button>
      </div>

      <div class="player-meta">
        <p class="player-title" id="player-title">night tape</p>
        <div class="player-wave" id="player-wave">
          <span></span><span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span><span></span><span></span>
        </div>
      </div>
    </div>

    <div class="radio-dial" id="radio-dial" aria-label="Radio channels"></div>
    <div class="radio-frame" id="radio-frame" aria-label="Lofi Girl radio"></div>

    <div class="rain-dial" id="rain-dial" aria-label="How hard it rains">
      <button class="rain-step" data-rain="drizzle" type="button">drizzle</button>
      <button class="rain-step" data-rain="steady" type="button">steady</button>
      <button class="rain-step" data-rain="downpour" type="button">downpour</button>
      <button class="rain-listen" id="rain-listen" type="button" aria-pressed="false">listen</button>
    </div>

    <p class="tonight" id="tonight"></p>

    <section class="journal" aria-label="Tonight's note">
      <p class="journal-ask">How was today?</p>

      <div class="journal-chips" id="journal-chips">
        <button class="chip" data-day="good" type="button"><span>&#128578;</span> good</button>
        <button class="chip" data-day="normal" type="button"><span>&#128528;</span> normal</button>
        <button class="chip" data-day="tired" type="button"><span>&#128533;</span> tired</button>
        <button class="chip" data-day="productive" type="button"><span>&#128293;</span> productive</button>
        <button class="chip" data-day="quiet" type="button"><span>&#127769;</span> quiet</button>
      </div>

      <input class="journal-note" id="journal-note" type="text" maxlength="140"
             placeholder="Tonight I&hellip;" autocomplete="off" spellcheck="false" />

      <p class="journal-kept" id="journal-kept">kept for tonight</p>
    </section>

    <p class="traces" id="traces"></p>
  </main>

  <p class="hint" id="hint"><span>1</span>&ndash;<span>6</span> moods &middot; <span>[</span> <span>]</span> rain &middot; <span>space</span> focus &middot; <span>&uarr;</span><span>&darr;</span> volume</p>

  <script src="app.js"></script>
</body>
</html>
