<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Late Night</title>
  <meta name="description" content="A tiny digital room for quiet evenings." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="aurora" aria-hidden="true"></div>
  <div class="city" aria-hidden="true"></div>
  <canvas class="rain-layer" id="rain" aria-hidden="true"></canvas>
  <div class="grain" aria-hidden="true"></div>

  <main class="room">
    <header class="intro">
      <p class="clock" id="clock">--:--</p>
      <h1 class="title">LATE&nbsp;NIGHT</h1>
      <p class="tagline">a tiny room for quiet evenings</p>
    </header>

    <section class="moods" aria-label="Choose a mood">
      <button class="mood" data-mood="calm" type="button"><span class="mood-icon">&#127769;</span><span class="mood-name">Calm</span></button>
      <button class="mood" data-mood="music" type="button"><span class="mood-icon">&#127911;</span><span class="mood-name">Music</span></button>
      <button class="mood" data-mood="focus" type="button"><span class="mood-icon">&#128293;</span><span class="mood-name">Focus</span></button>
      <button class="mood" data-mood="rain" type="button"><span class="mood-icon">&#127783;</span><span class="mood-name">Rain</span></button>
      <button class="mood" data-mood="space" type="button"><span class="mood-icon">&#127756;</span><span class="mood-name">Space</span></button>
      <button class="mood" data-mood="sleep" type="button"><span class="mood-icon">&#128164;</span><span class="mood-name">Sleep</span></button>
    </section>

    <p class="mood-line" id="mood-line"></p>
  </main>

  <script src="app.js"></script>
</body>
</html>
